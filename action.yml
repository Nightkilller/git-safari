name: Git-Safari
description: "Dynamic animated GitHub profile companions (Giraffe, Buffalo, Monkey, Train, Snowman) powered by your code!"
author: Nightkilller
branding:
  icon: globe
  color: orange

inputs:
  username:
    description: "GitHub username whose stats will power the creature"
    required: false
    default: ${{ github.repository_owner }}
  creature:
    description: "Creature to generate: giraffe, snowman, snake_train, monkey_tree, buffalo, or all"
    required: false
    default: "giraffe"
  output-dir:
    description: "Directory where the animated GIF(s) will be saved"
    required: false
    default: "safari"
  token:
    description: "GitHub token for querying API (built-in token is enough)"
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: bash
      run: pip install pillow requests

    - name: Generate Git-Safari Creature(s)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        python3 "${{ github.action_path }}/src/cli.py" \
          --username "${{ inputs.username }}" \
          --creature "${{ inputs.creature }}" \
          --output-dir "${{ inputs.output-dir }}"
