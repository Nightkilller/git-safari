name: Generate Demo Critters

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "action.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Generate All Critters
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 src/cli.py --username "${{ github.repository_owner }}" --creature all --output-dir assets

      - name: Commit assets if changed
        shell: bash
        run: |
          git add assets/*.gif
          if git diff --cached --quiet; then
            echo "Assets unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(assets): update demo critters"
          git push

